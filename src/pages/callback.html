<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>Masuk dengan Google · OneClass.7MIT</title>
<link rel="stylesheet" href="/assets/design.7mit.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
html,body{margin:0;min-height:100%}body{background:var(--surface);color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:var(--space-6)}
.card{width:min(460px,100%);text-align:center}
.card .eyebrow{display:block;margin-bottom:var(--space-4);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.ico{width:56px;height:56px;margin:0 auto var(--space-4);border-radius:50%;display:grid;place-items:center;background:var(--maroon-soft);color:var(--maroon-soft-ink)}
.ico svg{width:28px;height:28px}.ok .ico{background:var(--success-soft);color:var(--success-ink)}.err .ico{background:var(--danger-soft);color:var(--danger-ink)}
.spin{animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
h1{margin:0 0 var(--space-2);font:700 22px/28px var(--font-display)}p{margin:0;color:var(--ink-muted);font-size:14px;line-height:22px}
.row{display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap;margin-top:var(--space-5)}
.roles{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-5);text-align:left}
.role{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:var(--space-3) var(--space-4);border:1.5px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font:700 15px var(--font-sans);cursor:pointer}
.role small{display:block;font-weight:400;color:var(--ink-muted)}.role:hover{border-color:var(--maroon);background:var(--maroon-soft)}.role:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.role svg{width:18px;height:18px;flex:none}
[hidden]{display:none!important}
</style></head>
<body><main><section class="m7-card card" id="card" role="status" aria-live="polite">
<span class="eyebrow">OneClass.7MIT</span>
<div class="ico" id="ico"><i data-lucide="loader-circle" class="spin"></i></div>
<h1 id="t">Memverifikasi akun Google…</h1><p id="m">Tunggu sebentar, kamu diarahkan otomatis.</p>
<div class="roles" id="roles" hidden></div>
<div class="row" id="a" hidden></div>
</section></main>
<script src="/assets/config.js"></script>
<script src="/assets/oneclass-session.js"></script>
<script>
(function(){
var S=window.OneClassSession,$=function(i){return document.getElementById(i)};
var LABEL={student:'Siswa',guru:'Guru',pengurus:'Pengurus'};
var OK='<i data-lucide="check"></i>',ERR='<i data-lucide="circle-alert"></i>',BUSY='<i data-lucide="loader-circle" class="spin"></i>';
function icons(){try{window.lucide&&window.lucide.createIcons()}catch(e){}}
function state(kind,title,msg,actions){
  $('card').className='m7-card card '+kind;$('ico').innerHTML=kind==='ok'?OK:kind==='err'?ERR:BUSY;
  $('t').textContent=title;$('m').textContent=msg||'';$('roles').hidden=true;
  var a=$('a');a.innerHTML='';a.hidden=!(actions&&actions.length);
  (actions||[]).forEach(function(x){var l=document.createElement('a');l.className='m7-btn '+(x.alt?'m7-btn-secondary':'m7-btn-primary');l.href=x.href;l.textContent=x.label;a.appendChild(l)});icons();
}
function clean(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
function done(){try{sessionStorage.removeItem(S.INTENT)}catch(e){}}
function fail(msg,extra){clean();done();state('err','Masuk dengan Google gagal',msg,(extra||[]).concat([{label:'Kembali ke halaman masuk',href:'/',alt:true}]))}
async function google(access,expected){
  var r=await S.call('akun-google-auth',expected?{action:'google_login',expected_account_type:expected}:{action:'google_login'},null);
  return r;
}
async function finish(client,data){
  try{await client.auth.signOut()}catch(e){}
  clean();done();
  S.save(data.token,data.profile);
  var tl=null;try{tl=await S.trustSession(data.token)}catch(e){}
  if(tl)S.keepTrust(tl);
  var mode=(tl&&tl.mode)||data.profile.account_type;
  state('ok','Berhasil masuk','Halo, '+(data.profile.display_name||'selamat datang')+'. Membuka ruang kerja '+(LABEL[mode]||'')+'…',[{label:'Buka OneClass sekarang',href:S.homeFor(mode)}]);
  setTimeout(function(){location.replace(S.homeFor(mode))},800);
}
async function run(){
  var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
  var err=q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error');
  if(err){fail(decodeURIComponent(String(err).replace(/\+/g,' ')));return}
  var code=q.get('code');
  if(!code&&!h.get('access_token')){fail('Link callback tidak berisi kode dari Google. Mulai lagi dari halaman masuk.');return}
  var c=await S.googleClient(),session=null;
  if(code){var x=await c.auth.exchangeCodeForSession(code);if(x.error)throw x.error;session=x.data&&x.data.session}
  if(!session){var y=await c.auth.getSession();if(y.error)throw y.error;session=y.data&&y.data.session}
  if(!session||!session.access_token)throw new Error('Sesi Google tidak ditemukan setelah callback. Coba masuk lagi.');
  var call=async function(expected){
    var body=expected?{action:'google_login',expected_account_type:expected}:{action:'google_login'};
    var r=await fetch(OC().functionsUrl+'/akun-google-auth',{method:'POST',headers:{'Content-Type':'application/json',apikey:OC().anonKey,Authorization:'Bearer '+session.access_token},body:JSON.stringify(body),cache:'no-store'});
    var raw=await r.text(),d={};try{d=raw?JSON.parse(raw):{}}catch(e){}
    if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));
    return d;
  };
  state('busy','Menyiapkan sesi…','Mencocokkan akun Google dengan akun.7mit.');
  var d=await call('');
  if(d.link_required){try{await c.auth.signOut()}catch(e){}clean();done();state('err','Akun Google belum terhubung',(d.google&&d.google.email?d.google.email+' belum ':'Akun Google ini belum ')+'terhubung ke akun.7mit. Hubungkan dulu di akun.7mit lalu masuk lagi.',[{label:'Buka akun.7mit',href:'https://akun.7mit.org/akunmu'},{label:'Kembali',href:'/',alt:true}]);return}
  var types=d.available_account_types||[];
  if(types.length>1){
    // satu username punya beberapa peran: biarkan pengguna memilih (sesi pertama dicabut, dibuat ulang sesuai pilihan)
    try{await S.akun({action:'logout',token:d.token})}catch(e){}
    state('busy','Pilih peran','Akun Google ini terhubung ke username '+d.username+' dengan beberapa peran.');
    var box=$('roles');box.innerHTML='';box.hidden=false;
    types.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='role';b.innerHTML='<span><span></span><small></small></span><span aria-hidden="true"><i data-lucide="arrow-right"></i></span>';b.firstChild.firstChild.textContent=LABEL[t]||t;b.firstChild.lastChild.textContent='Masuk sebagai '+(LABEL[t]||t).toLowerCase();
      b.addEventListener('click',async function(){box.hidden=true;state('busy','Menyiapkan sesi…','');try{var r=await call(t);await finish(c,r)}catch(e){fail(String(e&&e.message||'Gagal memilih peran.'))}});box.appendChild(b)});icons();
    return;
  }
  if(!d.token||!d.profile)throw new Error('Sesi akun.7mit dari Google tidak berhasil dibuat.');
  await finish(c,d);
}
function OC(){return window.ONECLASS_CONFIG}
run().catch(function(e){fail(String((e&&e.message)||'Terjadi kesalahan saat memverifikasi akun Google.'))});
})();
</script></body></html>
