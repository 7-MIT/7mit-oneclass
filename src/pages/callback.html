<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#7a1424">
<title>Masuk dengan Google · OneClass.7MIT</title>
<link rel="icon" href="/assets/logo-7mit.jpg">
<link rel="stylesheet" href="/assets/design.7mit.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
html,body{margin:0;min-height:100%}body{background:var(--surface);color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:var(--space-6)}
.card{width:min(440px,100%)}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.m7-card-title{font-size:26px;line-height:32px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)}
.steps li{display:flex;align-items:center;gap:var(--space-3);font-size:14px;color:var(--ink-muted)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center}
.dot svg{width:13px;height:13px;stroke-width:3}
.steps li.run{color:var(--ink)}.steps li.run .dot{border-color:transparent}
.steps li.run .dot svg{width:20px;height:20px;stroke-width:2.5;color:var(--maroon);animation:spin .8s linear infinite}
.steps li.ok{color:var(--ink)}.steps li.ok .dot{background:var(--success-soft);border-color:var(--success-ink);color:var(--success-ink)}
.steps li.warn .dot{background:var(--warning-soft);border-color:var(--warning-ink);color:var(--warning-ink)}
.steps li.err{color:var(--ink)}.steps li.err .dot{background:var(--danger-soft);border-color:var(--danger-ink);color:var(--danger-ink)}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.steps li.run .dot svg{animation:none}}
.roles{display:flex;flex-direction:column;gap:var(--space-2)}
.role{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);width:100%;text-align:left;min-height:56px;padding:var(--space-3) var(--space-4);border:1.5px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font:700 15px var(--font-sans);cursor:pointer}
.role small{display:block;font-weight:400;color:var(--ink-muted);margin-top:2px}.role:hover{border-color:var(--maroon);background:var(--maroon-soft)}.role:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.role svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap}
[hidden]{display:none!important}
</style></head>
<body><main><section class="m7-card card stack" id="card" role="status" aria-live="polite">
  <div><h1 class="m7-card-title" id="t" style="margin:0">Menyiapkan OneClass…</h1><p class="m7-card-sub" id="m">Akun Google kamu dicocokkan, lalu peran dan hak aksesmu diperiksa di server.</p></div>
  <ol class="steps" id="steps">
    <li data-s="auth"><span class="dot"></span><span>Memverifikasi akun Google</span></li>
    <li data-s="role"><span class="dot"></span><span>Mencocokkan akun.7mit dan peran</span></li>
    <li data-s="trust"><span class="dot"></span><span>Pemeriksaan TrustLayer</span></li>
    <li data-s="open"><span class="dot"></span><span>Membuka ruang kerja</span></li>
  </ol>
  <div class="m7-alert m7-alert-danger" id="err" role="alert" hidden><i data-lucide="circle-alert"></i><div><b id="errT">Masuk dengan Google gagal</b><span id="errM"></span></div></div>
  <div class="m7-alert m7-alert-warning" id="warn" role="status" hidden><i data-lucide="triangle-alert"></i><div><b id="warnT"></b><span id="warnM"></span></div></div>
  <div class="roles" id="roles" hidden></div>
  <div class="row" id="a" hidden></div>
</section></main>
<script src="/assets/config.js"></script>
<script src="/assets/oneclass-session.js"></script>
<script>
(function(){
var S=window.OneClassSession,C=window.ONECLASS_CONFIG,$=function(i){return document.getElementById(i)};
var LABEL={student:'Siswa',guru:'Guru',pengurus:'Pengurus'};
function icons(){try{window.lucide&&window.lucide.createIcons()}catch(e){}}
function step(name,state){var li=document.querySelector('#steps li[data-s="'+name+'"]');if(!li)return;li.className=state;var ic=state==='ok'?'check':state==='warn'?'triangle-alert':state==='err'?'x':state==='run'?'loader-circle':'';li.querySelector('.dot').innerHTML=ic?'<i data-lucide="'+ic+'"></i>':'';icons()}
function actions(list){var a=$('a');a.innerHTML='';a.hidden=!(list&&list.length);(list||[]).forEach(function(x){var l=document.createElement('a');l.className='m7-btn '+(x.alt?'m7-btn-secondary':'m7-btn-primary');l.href=x.href;l.innerHTML='<i data-lucide="'+(x.icon||'arrow-left')+'"></i>';l.appendChild(document.createTextNode(x.label));a.appendChild(l)});icons()}
function clean(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
function done(){try{sessionStorage.removeItem(S.INTENT)}catch(e){}}
function fail(from,msg,extra){clean();done();if(from)step(from,'err');$('err').hidden=false;$('errM').textContent=msg;$('t').textContent='Tidak bisa melanjutkan';$('m').textContent='';actions((extra||[]).concat([{label:'Kembali ke halaman masuk',href:'/',alt:true}]));icons()}
async function finish(client,data){
  try{await client.auth.signOut()}catch(e){}
  clean();done();
  step('role','ok');step('trust','run');
  S.save(data.token,data.profile);
  var tl=null;try{tl=await S.trustSession(data.token)}catch(e){}
  var mode=(tl&&tl.mode)||data.profile.account_type;
  if(['student','guru','pengurus'].indexOf(mode)<0){S.clear();fail('trust','Tipe akun tidak dikenal oleh OneClass.');return}
  if(tl){S.keepTrust(tl);step('trust','ok')}else step('trust','warn');
  step('open','run');
  $('t').textContent='Halo, '+(data.profile.display_name||'selamat datang');
  $('m').textContent='Masuk sebagai '+LABEL[mode]+(data.profile.role&&data.profile.role!==LABEL[mode]?' · '+data.profile.role:'')+(tl?'':' (TrustLayer belum dapat dihubungi; server tetap menegakkan izin)');
  step('open','ok');
  setTimeout(function(){location.replace(S.homeFor(mode))},650);
}
async function run(){
  step('auth','run');
  var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
  var err=q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error');
  if(err){fail('auth',decodeURIComponent(String(err).replace(/\+/g,' ')));return}
  var code=q.get('code');
  if(!code&&!h.get('access_token')){fail('auth','Link callback tidak berisi kode dari Google. Mulai lagi dari halaman masuk.');return}
  var c=await S.googleClient(),session=null;
  if(code){var x=await c.auth.exchangeCodeForSession(code);if(x.error)throw x.error;session=x.data&&x.data.session}
  if(!session){var y=await c.auth.getSession();if(y.error)throw y.error;session=y.data&&y.data.session}
  if(!session||!session.access_token)throw new Error('Sesi Google tidak ditemukan setelah callback. Coba masuk lagi.');
  step('auth','ok');step('role','run');
  var call=async function(expected){
    var r=await fetch(C.functionsUrl+'/akun-google-auth',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey,Authorization:'Bearer '+session.access_token},body:JSON.stringify(expected?{action:'google_login',expected_account_type:expected}:{action:'google_login'}),cache:'no-store'});
    var raw=await r.text(),d={};try{d=raw?JSON.parse(raw):{}}catch(e){}
    if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));
    return d;
  };
  var d=await call('');
  if(d.link_required){
    try{await c.auth.signOut()}catch(e){}clean();done();step('role','warn');
    $('t').textContent='Akun Google belum terhubung';$('m').textContent='';
    $('warn').hidden=false;$('warnT').textContent=(d.google&&d.google.email)?d.google.email:'Akun Google ini';$('warnM').textContent='Belum terhubung ke akun.7mit. Hubungkan dulu di akun.7mit lalu masuk lagi.';
    actions([{label:'Buka akun.7mit',href:'https://akun.7mit.org/akunmu',icon:'external-link'},{label:'Kembali',href:'/',alt:true}]);icons();return;
  }
  var types=d.available_account_types||[];
  if(types.length>1){
    // satu username punya beberapa peran: pilih peran, sesi dibuat ulang sesuai pilihan
    try{await S.akun({action:'logout',token:d.token})}catch(e){}
    step('role','warn');$('t').textContent='Pilih peran';$('m').textContent='Akun Google ini terhubung ke username '+d.username+' dengan beberapa peran.';
    var box=$('roles');box.innerHTML='';box.hidden=false;
    types.forEach(function(t){
      var b=document.createElement('button');b.type='button';b.className='role';
      b.innerHTML='<span><span></span><small></small></span><span aria-hidden="true"><i data-lucide="arrow-right"></i></span>';
      b.firstChild.firstChild.textContent=LABEL[t]||t;b.firstChild.lastChild.textContent='Masuk sebagai '+(LABEL[t]||t).toLowerCase();
      b.addEventListener('click',async function(){box.hidden=true;step('role','run');$('t').textContent='Menyiapkan OneClass…';$('m').textContent='';try{var r=await call(t);await finish(c,r)}catch(e){fail('role',String(e&&e.message||'Gagal memilih peran.'))}});
      box.appendChild(b)});
    icons();return;
  }
  if(!d.token||!d.profile)throw new Error('Sesi akun.7mit dari Google tidak berhasil dibuat.');
  await finish(c,d);
}
window.addEventListener('load',icons);
run().catch(function(e){fail(null,String((e&&e.message)||'Terjadi kesalahan saat memverifikasi akun Google.'))});
})();
</script></body></html>
